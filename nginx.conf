# =====================================================================
#  Configuration nginx — sert l'interface et relaie l'API
#
#  * Les fichiers du site sont servis depuis /usr/share/nginx/html.
#  * Toute requête commençant par /api est transmise au conteneur du
#    back-end (nommé "garderie-api" ici). Ainsi, l'interface et l'API
#    partagent le même domaine : plus de souci de CORS, et le "/api"
#    par défaut du code fonctionne directement.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relais vers le back-end pour tout ce qui commence par /api
    location /api/ {
        # "garderie-api" = nom du conteneur back-end ; 3000 = son port.
        # Les deux conteneurs doivent être sur le même réseau Docker.
        proxy_pass http://garderie-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le service worker ne doit jamais être mis en cache par le navigateur,
    # pour qu'une future mise à jour soit toujours prise en compte.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Application monopage : toute autre URL renvoie index.html
    # (sinon un rafraîchissement sur une "page" interne donnerait 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
